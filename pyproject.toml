[project]
name = "pwa-proyecto"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
]

[project.optional-dependencies]
test = [
    "playwright",
    "pytest-playwright",
    "pytest-django",
]

[tool.pytest.ini_options]
# pytest-django needs the settings module for live_server + django_user_model.
DJANGO_SETTINGS_MODULE = "config.settings"
# The Django suite runs separately with `manage.py test`; pytest owns E2E only.
testpaths = ["tests-e2e"]
